name: Setup Frontend
description: Setup pnpm, Node.js 22, and install frontend dependencies

inputs:
  working-directory:
    description: Frontend workspace directory
    required: true

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      with:
        package_json_file: ${{ inputs.working-directory }}/package.json
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: '22'
        cache: pnpm
        cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
    - name: Install dependencies
      shell: bash
      # --ignore-scripts: a compromised transitive package must not run arbitrary code on the
      # runner. The image build and the scheduled rescan already pass it; the e2e job installs
      # the Playwright browsers explicitly with `pnpm exec playwright install`.
      run: pnpm install --frozen-lockfile --ignore-scripts
      working-directory: ${{ inputs.working-directory }}
