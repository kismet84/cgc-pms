name: CI
run-name: CI ${{ github.event_name }} ${{ github.event.pull_request.number || github.sha }}

on:
  push:
    branches-ignore: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BACKEND_JAR_ARTIFACT: backend-jar-${{ github.run_number }}-${{ github.sha }}
  BACKEND_COVERAGE_ARTIFACT: backend-coverage-${{ github.run_number }}-${{ github.sha }}
  FRONTEND_DIST_ARTIFACT: frontend-dist-${{ github.run_number }}-${{ github.sha }}
  FRONTEND_TEST_ARTIFACT: frontend-test-${{ github.run_number }}-${{ github.sha }}
  SBOM_ARTIFACT: sbom-artifacts-${{ github.run_number }}-${{ github.sha }}

jobs:
  pr-push-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      run-full: ${{ steps.mode.outputs.run-full }}
    steps:
      - name: Checkout trusted base CI verifier
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Resolve full-run or exact-SHA evidence reuse
        id: mode
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REUSE_ENABLED: ${{ vars.CI_PR_PUSH_REUSE_ENABLED }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $runFull = $true
          $mode = 'full'
          if ($env:EVENT_NAME -eq 'pull_request' -and $env:HEAD_REPOSITORY -eq $env:REPOSITORY) {
            $verifier = Join-Path $PWD 'scripts/ci/verify-pr-push-evidence.ps1'
            if (!(Test-Path -LiteralPath $verifier -PathType Leaf)) {
              $mode = 'bootstrap-full'
            } elseif ($env:REUSE_ENABLED -ne 'true') {
              $mode = 'reuse-disabled-full'
            } else {
              try {
                & $verifier `
                  -Repository $env:REPOSITORY `
                  -PullRequestNumber ([int]$env:PULL_REQUEST_NUMBER) `
                  -ExpectedHeadSha $env:HEAD_SHA `
                  -ExpectedBaseSha $env:BASE_SHA
                $runFull = $false
                $mode = 'reused-push-ci'
              } catch {
                $mode = 'evidence-failed-full'
                "reason=$($_.Exception.Message)" >> $env:GITHUB_STEP_SUMMARY
              }
            }
          } elseif ($env:EVENT_NAME -eq 'pull_request') {
            $mode = 'fork-full'
          }
          "run-full=$($runFull.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "mode=$mode" >> $env:GITHUB_STEP_SUMMARY

  desktop-launcher:
    needs: pr-push-evidence
    if: needs.pr-push-evidence.outputs.run-full == 'true'
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build Windows x64 launcher
        shell: pwsh
        run: ./desktop-launcher/scripts/build.ps1 -Configuration Release -Architecture x64
      - name: Run launcher contract tests
        shell: pwsh
        run: ./desktop-launcher/tests/launcher-contract.ps1
      - name: Run AutoPilot control-plane contracts
        shell: pwsh
        run: |
          ./scripts/codex-autopilot/test-codex-task-execution-policy.ps1
          ./scripts/codex-autopilot/test-native-command-semantics.ps1
          ./scripts/codex-autopilot/test-closeout.ps1
          ./scripts/codex-autopilot/test-evidence-verification.ps1
          ./scripts/codex-autopilot/test-control-plane-fingerprint.ps1
      - name: Reject unsafe Chromium flags and committed runtime artifacts
        shell: pwsh
        run: |
          $source = Get-Content -Raw -LiteralPath desktop-launcher/src/main.cpp
          foreach ($flag in '--disable-web-security', '--ignore-certificate-errors', '--no-sandbox', '--remote-debugging-port') {
            if ($source.Contains($flag)) { throw "Forbidden Chromium flag: $flag" }
          }
          $tracked = git ls-files desktop-launcher
          if ($tracked -match '(?i)(^|/)(\.cache|out|dist|profiles?|logs?|runtime)/|\.(zip|pdb|log)$') {
            throw 'Desktop launcher runtime/build artifact is tracked.'
          }

  backend-test:
    needs: pr-push-evidence
    if: needs.pr-push-evidence.outputs.run-full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-backend
      - name: Run backend tests with coverage
        run: cd backend && ./mvnw -C verify
        env:
          TEST_JWT_SECRET: ${{ secrets.CI_TEST_JWT_SECRET || 'test-only-ci-cgc-pms-jwt-secret-key-256bit-minimum-length' }}
      - name: Summarize backend tests
        if: always()
        shell: pwsh
        run: ./scripts/ci/summarize-surefire.ps1
      - name: Upload backend test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-test-reports-${{ github.run_number }}-${{ github.sha }}
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload backend jar
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.BACKEND_JAR_ARTIFACT }}
          path: backend/target/cgc-pms-backend.jar
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.BACKEND_COVERAGE_ARTIFACT }}
          path: backend/target/site/jacoco
          if-no-files-found: ignore
          retention-days: 14

  backend-order-sensitive:
    needs: pr-push-evidence
    if: needs.pr-push-evidence.outputs.run-full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-backend
      - name: Run historically order-sensitive classes under reverse class order
        run: cd backend && ./mvnw -C -Ptest-order-independence -Djacoco.skip=true test
        env:
          TEST_JWT_SECRET: ${{ secrets.CI_TEST_JWT_SECRET || 'test-only-ci-cgc-pms-jwt-secret-key-256bit-minimum-length' }}

  backend-dependency-scan:
    needs: pr-push-evidence
    if: needs.pr-push-evidence.outputs.run-full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Scan backend high and critical library vulnerabilities
        run: bash ./scripts/ci/scan-backend-dependencies.sh

  backend-test-mysql:
    needs: pr-push-evidence
    if: needs.pr-push-evidence.outputs.run-full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI_MYSQL_DATABASE: cgc_pms_test
      CI_MYSQL_USER: cgc_test
      CI_MYSQL_PASSWORD: ${{ secrets.CI_MYSQL_PASSWORD || format('ci-mysql-{0}', github.run_id) }}
      CI_MYSQL_ROOT_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD || format('ci-root-{0}', github.run_id) }}
    services:
      mysql:
        image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.CI_MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ env.CI_MYSQL_DATABASE }}
          MYSQL_USER: ${{ env.CI_MYSQL_USER }}
          MYSQL_PASSWORD: ${{ env.CI_MYSQL_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
      redis:
        image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-backend
      - name: Verify MySQL migration user scope
        shell: bash
        run: bash ./scripts/ci/verify-mysql-grants.sh "${{ job.services.mysql.id }}"
      - name: Run MySQL migration, tenant scope, and concurrency tests
        run: cd backend && ./mvnw -C -Dtest=FlywayMySqlSmokeTest,BaselineMySqlSmokeTest,BidProjectScopeMySqlTest,PaymentMySqlConcurrencyTest,MdMaterialDeleteMySqlConcurrencyTest test -Dspring.profiles.active=test
        env:
          TEST_JWT_SECRET: ${{ secrets.CI_TEST_JWT_SECRET || 'test-only-ci-cgc-pms-jwt-secret-key-256bit-minimum-length' }}
          CGCPMS_M52_MYSQL_BASELINE: "true"
          CGCPMS_M70_MYSQL_CONCURRENCY: "true"
          CGCPMS_MATERIAL_DELETE_MYSQL_CONCURRENCY: "true"
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/${{ env.CI_MYSQL_DATABASE }}
          SPRING_DATASOURCE_USERNAME: ${{ env.CI_MYSQL_USER }}
          SPRING_DATASOURCE_PASSWORD: ${{ env.CI_MYSQL_PASSWORD }}
      - name: Upload MySQL smoke test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-mysql-test-reports-${{ github.run_number }}-${{ github.sha }}
          path: backend/target/surefire-reports
          if-no-files-found: ignore
          retention-days: 7

  frontend-lint:
    needs: pr-push-evidence
    if: needs.pr-push-evidence.outputs.run-full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
        with:
          working-directory: frontend-admin-v2
      - name: Lint frontend
        shell: bash
        run: bash ./scripts/ci/run-frontend-lint.sh
      - name: Upload frontend lint evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-lint-report-${{ github.run_number }}-${{ github.sha }}
          path: frontend-admin-v2/.ci-artifacts/lint-check.txt
          if-no-files-found: ignore
          retention-days: 7

  type-check:
    needs: pr-push-evidence
    if: needs.pr-push-evidence.outputs.run-full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
        with:
          working-directory: frontend-admin-v2
      - name: TypeScript type check
        run: cd frontend-admin-v2 && pnpm type-check

  frontend-build:
    needs: pr-push-evidence
    if: needs.pr-push-evidence.outputs.run-full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
        with:
          working-directory: frontend-admin-v2
      - name: Install & Build
        run: cd frontend-admin-v2 && pnpm build
      - name: Check frontend bundle size
        run: cd frontend-admin-v2 && pnpm check:bundle-size
      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.FRONTEND_DIST_ARTIFACT }}
          path: frontend-admin-v2/dist
          if-no-files-found: error
          retention-days: 7

  frontend-test:
    needs: pr-push-evidence
    if: needs.pr-push-evidence.outputs.run-full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
        with:
          working-directory: frontend-admin-v2
      - name: Run frontend unit tests
        run: cd frontend-admin-v2 && pnpm test:ci
      - name: Upload frontend test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.FRONTEND_TEST_ARTIFACT }}
          path: frontend-admin-v2/test-results
          if-no-files-found: ignore
          retention-days: 7

  frontend-dependency-audit:
    needs: pr-push-evidence
    if: needs.pr-push-evidence.outputs.run-full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
        with:
          working-directory: frontend-admin-v2
      - name: Audit frontend dependencies with official registry
        run: cd frontend-admin-v2 && pnpm audit --audit-level high --registry=https://registry.npmjs.org

  frontend-v2-gate:
    needs: pr-push-evidence
    if: needs.pr-push-evidence.outputs.run-full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
        with:
          working-directory: frontend-admin-v2
      - name: Enforce Clean-room boundary and route ledger
        run: cd frontend-admin-v2 && pnpm check:boundary && pnpm check:route-ledger
      - name: Enforce unique design system standard
        run: cd frontend-admin-v2 && pnpm check:design-system

  supply-chain-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      [pr-push-evidence, backend-test, backend-dependency-scan, frontend-build]
    if: needs.pr-push-evidence.outputs.run-full == 'true'
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download backend jar
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ env.BACKEND_JAR_ARTIFACT }}
          path: artifacts/backend
      - name: Scan built backend jar
        run: |
          mkdir -p .trivy-cache
          docker run --rm \
            -v "$PWD/.trivy-cache:/root/.cache/trivy" \
            -v "$PWD/artifacts/backend:/workspace:ro" \
            aquasec/trivy:0.65.0@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436 \
            rootfs \
            --scanners vuln \
            --pkg-types library \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --format table \
            --timeout 10m \
            /workspace
      - name: Download frontend build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ env.FRONTEND_DIST_ARTIFACT }}
          path: artifacts/frontend-dist
      - name: Package frontend build artifact
        run: tar -C artifacts -czf artifacts/frontend-dist.tar.gz frontend-dist
      - name: Generate backend SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          file: artifacts/backend/cgc-pms-backend.jar
          format: spdx-json
          output-file: artifacts/backend/cgc-pms-backend.spdx.json
          upload-artifact: false
      - name: Generate frontend SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: artifacts/frontend-dist
          format: spdx-json
          output-file: artifacts/frontend-dist.spdx.json
          upload-artifact: false
      - name: Generate backend provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifacts/backend/cgc-pms-backend.jar
      - name: Generate backend SBOM attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifacts/backend/cgc-pms-backend.jar
          sbom-path: artifacts/backend/cgc-pms-backend.spdx.json
      - name: Generate frontend provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifacts/frontend-dist.tar.gz
      - name: Generate frontend SBOM attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifacts/frontend-dist.tar.gz
          sbom-path: artifacts/frontend-dist.spdx.json
      - name: Upload generated SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.SBOM_ARTIFACT }}
          path: |
            artifacts/backend/cgc-pms-backend.spdx.json
            artifacts/frontend-dist.spdx.json
          retention-days: 30

  e2e:
    runs-on: ubuntu-latest
    needs: [pr-push-evidence, frontend-build]
    if: needs.pr-push-evidence.outputs.run-full == 'true'
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
        with:
          working-directory: frontend-admin-v2
      - name: Download frontend build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ env.FRONTEND_DIST_ARTIFACT }}
          path: frontend-admin-v2/dist
      - name: Install Playwright dependencies
        run: cd frontend-admin-v2 && pnpm exec playwright install chromium
      - name: Run browser contract tests
        run: cd frontend-admin-v2 && pnpm test:e2e:contract
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
          PLAYWRIGHT_WEB_SERVER_COMMAND: pnpm preview --host 127.0.0.1 --port 4173
      - name: Upload E2E failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-failure-evidence-${{ github.run_number }}-${{ github.sha }}
          path: |
            frontend-admin-v2/playwright-report
            frontend-admin-v2/test-results
          if-no-files-found: ignore
          retention-days: 14

  sql-safety-scan:
    needs: pr-push-evidence
    if: needs.pr-push-evidence.outputs.run-full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify README and manual sync
        shell: pwsh
        env:
          README_SYNC_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          README_SYNC_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/check-readme-sync.mjs --range "$env:README_SYNC_BASE_SHA" "$env:README_SYNC_HEAD_SHA"
      - name: Verify CI workflow contract
        shell: pwsh
        run: ./scripts/ci/test-workflow-contract.ps1
      - name: Run long-task gate tests
        run: node --test .agents/skills/long-task-gate/tests/long-task-gate.test.mjs
      - name: Verify PR push evidence contract
        shell: pwsh
        run: ./scripts/ci/test-pr-push-evidence.ps1
      - name: Run SQL injection safety scan
        shell: pwsh
        run: ./scripts/check-sql-safety.ps1
      - name: Verify Flyway migration immutability
        shell: bash
        env:
          FLYWAY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          base="$FLYWAY_BASE_SHA"
          if [[ -z "$base" ]]; then base="origin/$DEFAULT_BRANCH"; fi
          bash scripts/check-flyway-immutability.sh --base "$base"

  build-summary:
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - pr-push-evidence
      - desktop-launcher
      - backend-test
      - backend-order-sensitive
      - backend-dependency-scan
      - backend-test-mysql
      - frontend-lint
      - type-check
      - frontend-build
      - frontend-test
      - frontend-dependency-audit
      - frontend-v2-gate
      - supply-chain-security
      - e2e
      - sql-safety-scan
    steps:
      - name: Write build summary
        run: |
          {
            echo "## CI Build Summary"
            echo ""
            echo "- Run number: ${{ github.run_number }}"
            echo "- Commit SHA: ${{ github.sha }}"
            echo "- PR push evidence: ${{ needs.pr-push-evidence.result }}"
            echo "- Core gate jobs: pr-push-evidence, desktop-launcher, backend-test, backend-order-sensitive, backend-dependency-scan, backend-test-mysql, frontend-lint, type-check, frontend-build, frontend-test, frontend-dependency-audit, frontend-v2-gate, sql-safety-scan, supply-chain-security, e2e (browser contract)"
            echo "- Artifacts: ${{ env.BACKEND_JAR_ARTIFACT }}, ${{ env.BACKEND_COVERAGE_ARTIFACT }}, ${{ env.FRONTEND_DIST_ARTIFACT }}, ${{ env.FRONTEND_TEST_ARTIFACT }}, ${{ env.SBOM_ARTIFACT }}"
            echo ""
            echo "### Job Results"
            echo "- desktop-launcher: ${{ needs.desktop-launcher.result }}"
            echo "- backend-test: ${{ needs.backend-test.result }}"
            echo "- backend-order-sensitive: ${{ needs.backend-order-sensitive.result }}"
            echo "- backend-dependency-scan: ${{ needs.backend-dependency-scan.result }}"
            echo "- backend-test-mysql: ${{ needs.backend-test-mysql.result }}"
            echo "- frontend-lint: ${{ needs.frontend-lint.result }}"
            echo "- type-check: ${{ needs.type-check.result }}"
