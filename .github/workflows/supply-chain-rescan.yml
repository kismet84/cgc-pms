name: Supply Chain Rescan
run-name: Supply Chain Rescan ${{ github.sha }}

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-dependency-rescan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-backend
      - name: Build and scan exact backend artifact
        shell: bash
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
          SCAN_OUTPUT_DIR: artifacts
          EXPECTED_GIT_SHA: ${{ github.sha }}
        run: |
          set -o pipefail
          mkdir -p artifacts
          echo "commit=${GITHUB_SHA}" > "artifacts/backend-${GITHUB_SHA}.log"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          (cd backend && ./mvnw -q -DskipTests package)
          bash ./scripts/ci/scan-backend-artifact.sh backend/target/cgc-pms-backend.jar \
            2>&1 | tee -a "artifacts/backend-${GITHUB_SHA}.log"
          cp backend/target/cgc-pms-backend.jar "artifacts/backend-${GITHUB_SHA}.jar"
      - name: Upload backend rescan result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: supply-chain-backend-${{ github.sha }}
          path: |
            artifacts/backend-${{ github.sha }}.log
            artifacts/backend-${{ github.sha }}.jar
            artifacts/backend-artifact-metadata.txt
            artifacts/backend-artifact-trivy.json
            artifacts/backend-artifact-trivy.stderr.log
          if-no-files-found: error
          retention-days: 30

  frontend-dependency-rescan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: frontend-admin-v2/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend-admin-v2/pnpm-lock.yaml
      - name: Install and audit frontend dependencies
        shell: bash
        working-directory: frontend-admin-v2
        run: |
          set -o pipefail
          mkdir -p ../artifacts
          echo "commit=${GITHUB_SHA}" > "../artifacts/frontend-${GITHUB_SHA}.log"
          pnpm install --frozen-lockfile --ignore-scripts 2>&1 | tee -a "../artifacts/frontend-${GITHUB_SHA}.log"
          pnpm audit --audit-level high --registry=https://registry.npmjs.org 2>&1 | tee -a "../artifacts/frontend-${GITHUB_SHA}.log"
      - name: Upload frontend rescan result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: supply-chain-frontend-${{ github.sha }}
          path: artifacts/frontend-${{ github.sha }}.log
          if-no-files-found: error
          retention-days: 30
