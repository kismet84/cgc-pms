const colors={client:'#57d3ff',library:'#a0e7e5',edge:'#ffd166',security:'#f78fb3',platform:'#9b8cff',domain:'#72e0a0',queue:'#ef9f6c',database:'#ffb86b',cache:'#ff7c90',external:'#6fd1c8',observability:'#78a9ff',delivery:'#b89cff'};
const typeNames={client:'客户端',library:'共享库',edge:'边缘代理',security:'安全认证',platform:'平台能力',domain:'业务域',queue:'异步任务',database:'数据库',cache:'缓存',external:'外部依赖',observability:'可观测性',delivery:'交付验证'};
const edgeNames={imports:'导入',calls:'调用',reads:'读取',writes:'写入',publishes:'发布',subscribes:'订阅'};
const $=s=>document.querySelector(s), svgNS='http://www.w3.org/2000/svg';
let data,positions=new Map(),selected=null,flowId='',scale=1,tx=0,ty=0,drag=null,graphSize={w:1900,h:860};
async function unpack(){const bytes=Uint8Array.from(atob(PACKED),c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));return JSON.parse(await new Response(stream).text())}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function el(tag,attrs={}){const n=document.createElementNS(svgNS,tag);for(const[k,v]of Object.entries(attrs))n.setAttribute(k,v);return n}
function barycentricLayout(nodes){const byLayer=new Map();for(const n of nodes){if(!byLayer.has(n.layer))byLayer.set(n.layer,[]);byLayer.get(n.layer).push(n)}const layers=[...byLayer.keys()].sort((a,b)=>a-b);const neighbors=(id,dir)=>data.edges.filter(e=>dir<0?e.to===id:e.from===id).map(e=>dir<0?e.from:e.to);for(let pass=0;pass<5;pass++){for(const direction of [1,-1]){const order=direction>0?layers:[...layers].reverse();for(const layer of order){const list=byLayer.get(layer),adj=byLayer.get(layer-direction);if(!adj)continue;const rank=new Map(adj.map((n,i)=>[n.id,i]));list.sort((a,b)=>{const score=n=>{const r=neighbors(n.id,-direction).map(x=>rank.get(x)).filter(Number.isFinite);return r.length?r.reduce((x,y)=>x+y,0)/r.length:999};return score(a)-score(b)||a.id.localeCompare(b.id)})}}}const max=Math.max(...[...byLayer.values()].map(x=>x.length));for(const layer of layers){const list=byLayer.get(layer),gap=132,offset=(max-list.length)*gap/2;list.forEach((n,i)=>positions.set(n.id,{x:90+layer*270,y:95+offset+i*gap,w:210,h:78}))}graphSize={w:Math.max(...layers)*270+390,h:max*132+140}}
function edgePath(a,b,i){const sx=a.x+a.w,sy=a.y+a.h/2,ex=b.x,ey=b.y+b.h/2;if(a.x===b.x){const bend=a.x+a.w+34+(i%3)*13;return `M${sx},${sy} C${bend},${sy} ${bend},${ey} ${ex+a.w},${ey}`}const dx=Math.max(46,(ex-sx)*.5);return `M${sx},${sy} C${sx+dx},${sy} ${ex-dx},${ey} ${ex},${ey}`}
function render(){barycentricLayout(data.nodes);renderBoundaries();const eg=$('#edges'),ng=$('#nodes');eg.textContent='';ng.textContent='';data.edges.forEach((e,i)=>{const p=el('path',{d:edgePath(positions.get(e.from),positions.get(e.to),i),class:`edge ${e.type}`,'data-from':e.from,'data-to':e.to,'data-type':e.type,'marker-end':'url(#arrow)'});p.appendChild(el('title'));p.firstChild.textContent=`${data.nodes.find(n=>n.id===e.from)?.label||e.from} → ${data.nodes.find(n=>n.id===e.to)?.label||e.to} · ${edgeNames[e.type]||e.type}`;eg.appendChild(p)});for(const n of data.nodes){const p=positions.get(n.id),g=el('g',{class:'node','data-id':n.id,tabindex:'0',role:'button','aria-label':`${n.label}：${n.role}`,style:`--node:${colors[n.type]||'#8fa5b8'}`,transform:`translate(${p.x} ${p.y})`});g.innerHTML=`<rect width="${p.w}" height="${p.h}"/><rect class="stripe" width="5" height="${p.h}"/><text class="kind" x="16" y="18">${esc(typeNames[n.type]||n.type)}</text><text class="name" x="16" y="39">${esc(n.label)}</text><text class="role" x="16" y="58">${esc(n.role.slice(0,28))}${n.role.length>28?'…':''}</text>`;g.addEventListener('click',()=>selectNode(n.id));g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectNode(n.id)}});g.addEventListener('pointerenter',e=>showTip(e,n));g.addEventListener('pointermove',moveTip);g.addEventListener('pointerleave',hideTip);ng.appendChild(g)}applyState();requestAnimationFrame(fitGraph)}
function renderBoundaries(){const bg=$('#boundaries');bg.textContent='';const groups=[['浏览器',0,0],['边缘代理',1,1],['后端与业务域',2,4],['数据与外部依赖',5,5],['交付验证',6,6]];for(const[name,a,b]of groups){const x=55+a*270,w=(b-a+1)*270+215,g=el('g',{class:'boundary'});g.append(el('rect',{x,y:48,width:w,height:graphSize.h-66,rx:16}));const t=el('text',{x:x+14,y:72});t.textContent=name;g.append(t);bg.append(g)}}
function reach(id,dir){const seen=new Set(),q=[id];while(q.length){const cur=q.shift();for(const e of data.edges){const next=dir==='up'&&e.to===cur?e.from:dir==='down'&&e.from===cur?e.to:null;if(next&&!seen.has(next)&&next!==id){seen.add(next);q.push(next)}}}return seen}
function applyState(){const q=$('#search').value.trim().toLowerCase(),type=$('#typeFilter').value,flow=data.flows.find(f=>f.id===flowId),flowNodes=new Set(flow?.steps||[]),flowPairs=new Set((flow?.steps||[]).slice(1).map((x,i)=>`${flow.steps[i]}|${x}`)),up=selected?reach(selected,'up'):new Set(),down=selected?reach(selected,'down'):new Set();document.querySelectorAll('.node').forEach(g=>{const n=data.nodes.find(x=>x.id===g.dataset.id),hay=[n.id,n.label,n.role,n.path,n.type].join(' ').toLowerCase(),hidden=type&&n.type!==type,context=!selected||n.id===selected||up.has(n.id)||down.has(n.id)||(n.id==='ci-verification'&&data.nodes.find(x=>x.id===selected)?.tests.length);g.className.baseVal='node';if(hidden)g.classList.add('hidden');if(q&&!hay.includes(q))g.classList.add('dim');else if(q)g.classList.add('match');if(flow&& !flowNodes.has(n.id))g.classList.add('dim');if(selected&&!context)g.classList.add('dim');if(n.id===selected)g.classList.add('active');else if(up.has(n.id))g.classList.add('upstream');else if(down.has(n.id))g.classList.add('downstream');if(selected&&n.id==='ci-verification'&&data.nodes.find(x=>x.id===selected)?.tests.length)g.classList.add('test-related')});document.querySelectorAll('.edge').forEach(g=>{const pair=`${g.dataset.from}|${g.dataset.to}`;g.setAttribute('marker-end','url(#arrow)');g.classList.remove('active','context','dim');if(flow){if(flowPairs.has(pair)){g.classList.add('active');g.setAttribute('marker-end','url(#arrowActive)')}else g.classList.add('dim')}if(selected){const inContext=(up.has(g.dataset.from)||g.dataset.from===selected)&&(down.has(g.dataset.to)||g.dataset.to===selected||up.has(g.dataset.to))||(down.has(g.dataset.from)||g.dataset.from===selected)&&(down.has(g.dataset.to)||g.dataset.to===selected);if(inContext)g.classList.add('context');else g.classList.add('dim')}});updateStatus()}
function selectNode(id){selected=selected===id?null:id;flowId='';$('#flowSelect').value='';applyState();selected?renderNodePanel(data.nodes.find(n=>n.id===selected)):renderWelcome()}
function renderNodePanel(n){const incoming=data.edges.filter(e=>e.to===n.id),outgoing=data.edges.filter(e=>e.from===n.id),flows=data.flows.filter(f=>f.steps.includes(n.id));$('#panel').innerHTML=`<div class="eyebrow">${esc(n.boundary)} · ${esc(typeNames[n.type]||n.type)}</div><h2>${esc(n.label)}</h2><div class="path">${esc(n.path)}</div><p>${esc(n.role)}</p><span class="pill">上游 ${reach(n.id,'up').size}</span><span class="pill">下游 ${reach(n.id,'down').size}</span><span class="pill">测试 ${n.tests.length}</span>${section('直接调用方',incoming.map(e=>edgeItem(e,true)))}${section('直接影响',outgoing.map(e=>edgeItem(e,false)))}${section('相关测试',n.tests.map(x=>sourceItem(x)))}${section('所属流程',flows.map(f=>`<div class="item"><b>${esc(f.name)}</b><small>${esc(f.outcome)}</small></div>`))}${section('约束',n.constraints.map(x=>`<div class="item"><small>${esc(x)}</small></div>`))}${section('源码证据',n.evidence.map(x=>sourceItem(x)))}`}
function section(title,items){return `<h3>${esc(title)}</h3>${items.length?`<div class="list">${items.join('')}</div>`:'<div class="empty">无已确认项</div>'}`}
function edgeItem(e,incoming){const other=data.nodes.find(n=>n.id===(incoming?e.from:e.to));return `<div class="item"><b>${esc(other?.label||'未知模块')}</b><small>${esc(edgeNames[e.type]||e.type)} · ${esc(e.evidence[0].path)} # ${esc(e.evidence[0].symbol)}</small></div>`}
function sourceItem(x){return `<div class="item"><b>${esc(x.symbol)}</b><small class="path">${esc(x.path)}</small></div>`}
function selectFlow(id){selected=null;flowId=id;applyState();const f=data.flows.find(x=>x.id===id);if(!f)return renderWelcome();$('#panel').innerHTML=`<div class="eyebrow">端到端流程</div><h2>${esc(f.name)}</h2><h3>触发</h3><p>${esc(f.trigger)}</p><h3>完整路径</h3><div class="flowline">${f.steps.map((id,i)=>`${i?'<i>→</i>':''}<span>${esc(data.nodes.find(n=>n.id===id)?.label||id)}</span>`).join('')}</div><h3>结果</h3><p>${esc(f.outcome)}</p><h3>源码状态</h3><div class="item"><b>全部关系有源码证据</b><small>路径中的每一对相邻节点均映射到 codemap.json 边。</small></div>`}
function renderWelcome(){$('#panel').innerHTML=`<div class="eyebrow">仓库概览</div><h2>cgc-pms 架构</h2><p>选择模块回答三件事：谁调用它、它影响什么、哪些测试覆盖它。</p><span class="pill"><span class="count">${data.nodes.length}</span>&nbsp;节点</span><span class="pill"><span class="count">${data.edges.length}</span>&nbsp;边</span><span class="pill"><span class="count">${data.flows.length}</span>&nbsp;流程</span><h3>边界</h3><p>浏览器 → 边缘代理 → 后端 / 业务域 → 数据 / 外部依赖。CI 从交付边界独立验证关键组件。</p><h3>证据规则</h3><p>图中只展示带源码路径和符号的关系；未取得证据的关系不进入边集合。</p>`}
function showTip(e,n){const t=$('#tooltip');t.innerHTML=`<strong>${esc(n.label)}</strong><span>${esc(n.role)}<br>${esc(n.path)}</span>`;t.style.opacity=1;moveTip(e)}function moveTip(e){const t=$('#tooltip');t.style.left=Math.min(innerWidth-310,e.clientX+8)+'px';t.style.top=Math.min(innerHeight-100,e.clientY+8)+'px'}function hideTip(){$('#tooltip').style.opacity=0}
function setTransform(){document.getElementById('viewport').setAttribute('transform',`translate(${tx} ${ty}) scale(${scale})`)}function zoom(f,cx=$('#graph').clientWidth/2,cy=$('#graph').clientHeight/2){const old=scale;scale=Math.max(.2,Math.min(2.8,scale*f));tx=cx-(cx-tx)*(scale/old);ty=cy-(cy-ty)*(scale/old);setTransform()}function fitGraph(){const svg=$('#graph'),pad=35;scale=Math.min((svg.clientWidth-pad*2)/graphSize.w,(svg.clientHeight-pad*2)/graphSize.h,1.15);tx=(svg.clientWidth-graphSize.w*scale)/2;ty=(svg.clientHeight-graphSize.h*scale)/2;setTransform()}
function updateStatus(){const type=$('#typeFilter').value,visible=data.nodes.filter(n=>!type||n.type===type).length;$('#status').innerHTML=`<b>${visible}</b> 节点 · <b>${data.edges.length}</b> 源码边 · 拖动 / 滚轮缩放`}
async function init(){try{data=await unpack();const types=[...new Set(data.nodes.map(n=>n.type))].sort();for(const t of types)$('#typeFilter').insertAdjacentHTML('beforeend',`<option value="${esc(t)}">${esc(typeNames[t]||t)}</option>`);$('#flowSelect').innerHTML='<option value="">选择核心流程…</option>'+data.flows.map(f=>`<option value="${esc(f.id)}">${esc(f.name)}</option>`).join('');$('#legend').innerHTML=types.map(t=>`<span><i style="background:${colors[t]}"></i>${esc(typeNames[t]||t)}</span>`).join('')+'<span>— 调用/导入</span><span>┄ 读取</span><span style="color:#c08d50">— 写入</span><span style="color:#9b76d7">┄ 发布</span>';render();renderWelcome();$('#search').addEventListener('input',applyState);$('#typeFilter').addEventListener('change',applyState);$('#flowSelect').addEventListener('change',e=>selectFlow(e.target.value));$('#zoomIn').onclick=()=>zoom(1.2);$('#zoomOut').onclick=()=>zoom(.82);$('#fit').onclick=fitGraph;$('#reset').onclick=()=>{selected=null;flowId='';$('#flowSelect').value='';$('#search').value='';$('#typeFilter').value='';applyState();renderWelcome();fitGraph()};const svg=$('#graph');svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoom(e.deltaY<0?1.12:.89,e.clientX-r.left,e.clientY-r.top)},{passive:false});svg.addEventListener('pointerdown',e=>{if(e.target.closest('.node'))return;drag={x:e.clientX,y:e.clientY,tx,ty};svg.setPointerCapture(e.pointerId);svg.classList.add('dragging')});svg.addEventListener('pointermove',e=>{if(!drag)return;tx=drag.tx+e.clientX-drag.x;ty=drag.ty+e.clientY-drag.y;setTransform()});svg.addEventListener('pointerup',()=>{drag=null;svg.classList.remove('dragging')});addEventListener('resize',fitGraph)}catch(err){$('#panel').innerHTML=`<div class="empty">代码地图载入失败：${esc(err.message)}。请使用支持 DecompressionStream 的现代浏览器。</div>`;$('#status').textContent='载入失败'}}
init();
</script>
</body>
