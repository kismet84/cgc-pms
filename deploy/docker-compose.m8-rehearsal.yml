services:
  frontend-v2-root:
    build:
      context: ..
      dockerfile: frontend-admin-v2/Dockerfile
      args:
        VITE_BASE_PATH: /
    volumes:
      - ./m8/nginx.v2-root.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - dev

  edge:
    image: nginx:1.27-alpine
    environment:
      M8_FRONTEND_UPSTREAM: ${M8_FRONTEND_UPSTREAM:-frontend-v2-root:80}
    ports:
      - "127.0.0.1:${M8_EDGE_PORT:-5180}:80"
    volumes:
      - ./m8/nginx.edge.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks:
      - dev

networks:
  dev:
    external: true
    name: deploy_cgc-pms-dev-net
