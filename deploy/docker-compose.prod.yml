# =============================================================================
# CGC-PMS Production Docker Compose
# =============================================================================
# Usage:
#   1. Copy .env.example to .env and fill in ALL values (including JWT_SECRET)
#   2. Generate SSL certificates (or use volume mount):
#        mkdir -p ssl
#        openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#          -keyout ssl/server.key -out ssl/server.crt \
#          -subj "/CN=your-domain.com"
#   3. Start:  docker compose -f docker-compose.prod.yml up -d
#   4. Stop:   docker compose -f docker-compose.prod.yml down
# =============================================================================

services:
  # ===========================================================================
  # Preflight — fail fast if required variables are missing or still CHANGE-ME
  # This container exits 0 (success) only when ALL checks pass.
  # Other services depend on it so they won't start until preflight succeeds.
  # ===========================================================================
  preflight:
    build:
      context: ./mysql
      dockerfile: Preflight.Dockerfile
    container_name: cgc-pms-preflight
    restart: "no"
    entrypoint: []
    command:
      - sh
      - -c
      - |
        echo "=== CGC-PMS Production Preflight ==="
        fail() { echo "  [FAIL] $$1"; exit 1; }
        pass() { echo "  [PASS] $$1"; }
        check_not_empty() {
          eval "val=\"\$$$1\""
          if [ -z "$$val" ]; then fail "$1 is empty or not set"; else pass "$1 is set"; fi
        }
        check_not_change_me() {
          eval "val=\"\$$$1\""
          case "$$val" in *CHANGE-ME*|*change-me*) fail "$1 still contains CHANGE-ME placeholder";; *) pass "$1 value looks valid";; esac
        }
        check_length() {
          eval "val=\"\$$$1\""
          if [ "$${#val}" -lt "$2" ]; then fail "$1 is too short (<$$2 chars, got $${#val})"; else pass "$1 length OK ($${#val} chars)"; fi
        }
        check_file() {
          if [ -f "$$1" ] && [ -s "$$1" ]; then pass "File $$1 exists and non-empty";
          else fail "File $$1 missing or empty (SSL certificate required)"; fi
        }
        check_mysql_tls_material() {
          ca=/run/secrets/mysql/ca.pem
          cert=/run/secrets/mysql/server-cert.pem
          key=/run/secrets/mysql/server-key.pem
          truststore=/run/secrets/mysql-truststore.p12
          su-exec 27:27 test -r "$$key" || fail "MySQL server key must be readable by the MySQL image user"
          su-exec 27:27 test ! -w "$$key" || fail "MySQL server key must not be writable by the MySQL runtime"
          openssl verify -CAfile "$$ca" "$$cert" >/dev/null 2>&1 || fail "MySQL server certificate chain is invalid"
          openssl x509 -in "$$ca" -noout -text 2>/dev/null | grep -q 'CA:TRUE' || fail "MySQL CA certificate lacks CA:TRUE"
          openssl x509 -in "$$cert" -noout -purpose 2>/dev/null | grep -q 'SSL server : Yes' || fail "MySQL server certificate lacks serverAuth purpose"
          openssl x509 -in "$$cert" -checkend 2592000 -noout >/dev/null 2>&1 || fail "MySQL server certificate expires within 30 days"
          openssl x509 -in "$$cert" -noout -ext subjectAltName 2>/dev/null | grep -Eq 'DNS:mysql([,[:space:]]|$$)' || fail "MySQL server certificate SAN lacks DNS:mysql"
          cert_public="$$(openssl x509 -in "$$cert" -pubkey -noout 2>/dev/null | openssl pkey -pubin -outform PEM 2>/dev/null)"
          key_public="$$(openssl pkey -in "$$key" -pubout -outform PEM 2>/dev/null)"
          [ -n "$$cert_public" ] && [ "$$cert_public" = "$$key_public" ] || fail "MySQL server certificate and key do not match"
          truststore_dump="$$(openssl pkcs12 -in "$$truststore" -passin env:MYSQL_TRUSTSTORE_PASSWORD -nokeys -info 2>&1)" || fail "MySQL truststore password or PKCS12 structure is invalid"
          printf '%s\n' "$$truststore_dump" | grep -q 'Trusted key usage' || fail "MySQL truststore CA must be a Java trustedCertEntry"
          [ "$$(printf '%s\n' "$$truststore_dump" | grep -c -- '-----BEGIN CERTIFICATE-----')" = 1 ] || fail "MySQL truststore must contain exactly one CA certificate"
          [ "$$(printf '%s\n' "$$truststore_dump" | grep -c 'Trusted key usage')" = 1 ] || fail "MySQL truststore must contain exactly one trustedCertEntry"
          if printf '%s\n' "$$truststore_dump" | grep -Eiq 'keybag'; then fail "MySQL truststore must not contain private key entries"; fi
          trust_ca_fingerprint="$$(printf '%s\n' "$$truststore_dump" | openssl x509 -noout -fingerprint -sha256 2>/dev/null)"
          ca_fingerprint="$$(openssl x509 -in "$$ca" -noout -fingerprint -sha256 2>/dev/null)"
          [ -n "$$trust_ca_fingerprint" ] && [ "$$trust_ca_fingerprint" = "$$ca_fingerprint" ] || fail "MySQL truststore CA certificate does not match the MySQL CA"
          pass "MySQL TLS certificate chain, identity and truststore are valid"
        }
        check_digest() {
          eval "val=\"\$$$1\""
          if printf '%s' "$$val" | grep -Eq '^sha256:[0-9a-f]{64}$$'; then pass "$1 digest format OK";
          else fail "$1 must be sha256 plus 64 lowercase hex characters"; fi
        }
        echo ""
        echo "--- Critical Secrets ---"
        check_not_empty   "JWT_SECRET"
        check_not_change_me "JWT_SECRET"
        check_length      "JWT_SECRET" 32
        check_not_empty   "MYSQL_ROOT_PASSWORD"
        check_not_change_me "MYSQL_ROOT_PASSWORD"
        check_not_empty   "MYSQL_PASSWORD"
        check_not_change_me "MYSQL_PASSWORD"
        check_not_empty   "MYSQL_TRUSTSTORE_PASSWORD"
        check_not_change_me "MYSQL_TRUSTSTORE_PASSWORD"
        check_not_empty   "REDIS_PASSWORD"
        check_not_change_me "REDIS_PASSWORD"
        check_not_empty   "MINIO_ROOT_USER"
        check_not_change_me "MINIO_ROOT_USER"
        check_not_empty   "MINIO_ROOT_PASSWORD"
        check_not_change_me "MINIO_ROOT_PASSWORD"
        check_not_empty   "MINIO_ACCESS_KEY"
        check_not_change_me "MINIO_ACCESS_KEY"
        check_not_empty   "MINIO_SECRET_KEY"
        check_not_change_me "MINIO_SECRET_KEY"
        if [ "$$MINIO_ACCESS_KEY" = "$$MINIO_ROOT_USER" ]; then fail "MINIO_ACCESS_KEY must not reuse MINIO_ROOT_USER"; else pass "MinIO application account is isolated"; fi
        if [ "$$MINIO_SECRET_KEY" = "$$MINIO_ROOT_PASSWORD" ]; then fail "MINIO_SECRET_KEY must not reuse MINIO_ROOT_PASSWORD"; else pass "MinIO application secret is isolated"; fi
        check_not_empty   "JASYPT_ENCRYPTOR_PASSWORD"
        check_not_change_me "JASYPT_ENCRYPTOR_PASSWORD"
        echo ""
        echo "--- SSL Certificates ---"
        check_file "/etc/nginx/ssl/server.crt"
        check_file "/etc/nginx/ssl/server.key"
        check_file "/run/secrets/mysql/ca.pem"
        check_file "/run/secrets/mysql/server-cert.pem"
        check_file "/run/secrets/mysql/server-key.pem"
        check_file "/run/secrets/mysql-truststore.p12"
        check_mysql_tls_material
        echo ""
        echo "--- Image Digests (immutable sha256) ---"
        check_not_empty "BACKEND_DIGEST"
        check_not_empty "FRONTEND_DIGEST"
        check_digest "BACKEND_DIGEST"
        check_digest "FRONTEND_DIGEST"
        echo ""
        echo "=== Preflight PASSED ==="
        exit 0
    environment:
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in .env}
      - MYSQL_TRUSTSTORE_PASSWORD=${MYSQL_TRUSTSTORE_PASSWORD:?MYSQL_TRUSTSTORE_PASSWORD must be set in .env}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set in .env}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY must be set in .env}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set in .env}
      - JASYPT_ENCRYPTOR_PASSWORD=${JASYPT_ENCRYPTOR_PASSWORD:?JASYPT_ENCRYPTOR_PASSWORD must be set in .env}
      - BACKEND_DIGEST=${BACKEND_DIGEST:?BACKEND_DIGEST must be set (sha256:...)}
      - FRONTEND_DIGEST=${FRONTEND_DIGEST:?FRONTEND_DIGEST must be set (sha256:...)}
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
      - ${MYSQL_CA_FILE:?MYSQL_CA_FILE must point to the MySQL CA certificate}:/run/secrets/mysql/ca.pem:ro
      - ${MYSQL_SERVER_CERT_FILE:?MYSQL_SERVER_CERT_FILE must point to the MySQL server certificate}:/run/secrets/mysql/server-cert.pem:ro
      - ${MYSQL_SERVER_KEY_FILE:?MYSQL_SERVER_KEY_FILE must point to the MySQL server key}:/run/secrets/mysql/server-key.pem:ro
      - ${MYSQL_TRUSTSTORE_FILE:?MYSQL_TRUSTSTORE_FILE must point to the backend PKCS12 truststore}:/run/secrets/mysql-truststore.p12:ro
    networks:
      - cgc-pms-net
  # ===========================================================================
  # MySQL 8.4.12 — new volume only; see the logical upgrade/rollback procedure.
  # ===========================================================================
  mysql:
    build:
      context: ./mysql
      dockerfile: Dockerfile
    platform: linux/amd64
    container_name: cgc-pms-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-cgc_pms}
      MYSQL_USER: ${MYSQL_USER:-cgc}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    # NOTE: In production, MySQL listens on the internal Docker network only.
    # Uncomment the ports line below if host access is needed (e.g. for DBA tools).
    # ports:
    #   - "3307:3306"
    volumes:
      - mysql84-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
      - ${MYSQL_CA_FILE:?MYSQL_CA_FILE must point to the MySQL CA certificate}:/run/secrets/mysql/ca.pem:ro
      - ${MYSQL_SERVER_CERT_FILE:?MYSQL_SERVER_CERT_FILE must point to the MySQL server certificate}:/run/secrets/mysql/server-cert.pem:ro
      - ${MYSQL_SERVER_KEY_FILE:?MYSQL_SERVER_KEY_FILE must point to the MySQL server key}:/run/secrets/mysql/server-key.pem:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
      - --require-secure-transport=ON
      - --ssl-ca=/run/secrets/mysql/ca.pem
      - --ssl-cert=/run/secrets/mysql/server-cert.pem
      - --ssl-key=/run/secrets/mysql/server-key.pem
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h localhost -u root || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cgc-pms-net
    deploy:
      resources:
        limits:
          memory: 512M

  # ===========================================================================
  # Redis 7 — cache + session store + token blacklist
  # ===========================================================================
  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    container_name: cgc-pms-redis
    restart: unless-stopped
    # NOTE: In production, Redis listens on the internal Docker network only.
    # Uncomment the ports line below if host access is needed.
    # ports:
    #   - "6379:6379"
    volumes:
      - redis-data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - cgc-pms-net
    deploy:
      resources:
        limits:
          memory: 256M

  # ===========================================================================
  # MinIO — S3-compatible object storage
  # ===========================================================================
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z@sha256:9535594ad4122b7a78c6632788a989b96d9199b483d3bd71a5ceae73a922cdfa
    container_name: cgc-pms-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    # NOTE: In production, MinIO is accessed through the backend proxy.
    # Uncomment the ports line below if direct host access is needed.
    # ports:
    #   - "9000:9000"
    #   - "9001:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cgc-pms-net
    deploy:
      resources:
        limits:
          memory: 512M

  # ===========================================================================
  # ClamAV — real malware scanning, internal network only
  # ===========================================================================
  clamav:
    image: clamav/clamav:1.4.3_base@sha256:629a3050df6a706aedb31859fbb8139e9aaf8f56b0ffefbf251b8358a7c9e76c
    container_name: cgc-pms-clamav
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
    networks:
      - cgc-pms-net
    deploy:
      resources:
        limits:
          memory: 1536M

  # ===========================================================================
  # Backend — Spring Boot Java 21 REST API (:8080)
  # ===========================================================================
  backend:
    image: ${REGISTRY_URL:-}cgc-pms-backend@${BACKEND_DIGEST:?BACKEND_DIGEST must be set}
    container_name: cgc-pms-backend
    restart: unless-stopped
    # Compose local runtime and Swarm-compatible deploy metadata must agree.
    mem_limit: 1G
    depends_on:
      preflight:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy
    environment:
      # ---- Spring profile ----
      SPRING_PROFILES_ACTIVE: prod
      # ---- Database (service names resolve via Docker network) ----
      # TLS level and trust source are single-sourced by application-prod.yml Hikari properties.
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-cgc_pms}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai"
      DB_USERNAME: ${MYSQL_USER:-cgc}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_TRUSTSTORE_URL: file:/run/secrets/mysql-truststore.p12
      DB_TRUSTSTORE_TYPE: PKCS12
      DB_TRUSTSTORE_PASSWORD: ${MYSQL_TRUSTSTORE_PASSWORD}
      # ---- Redis ----
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      # ---- MinIO ----
      MINIO_ENDPOINT: "http://minio:9000"
      # Browser-reachable origin; must not expose Docker-only service hostname.
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:?MINIO_PUBLIC_ENDPOINT is required}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      # ---- Malware scan (fail closed) ----
      VIRUS_SCAN_ENABLED: ${VIRUS_SCAN_ENABLED:-true}
      VIRUS_SCAN_HOST: ${VIRUS_SCAN_HOST:-clamav}
      VIRUS_SCAN_PORT: ${VIRUS_SCAN_PORT:-3310}
      # ---- JWT (MUST be set in .env for production) ----
      JWT_SECRET: ${JWT_SECRET}
      JASYPT_ENCRYPTOR_PASSWORD: ${JASYPT_ENCRYPTOR_PASSWORD}
      CGCPMS_BOOTSTRAP_ENABLED: ${CGCPMS_BOOTSTRAP_ENABLED:-false}
      CGCPMS_BOOTSTRAP_TENANT_ID: ${CGCPMS_BOOTSTRAP_TENANT_ID:-0}
      CGCPMS_BOOTSTRAP_COMPANY_CODE: ${CGCPMS_BOOTSTRAP_COMPANY_CODE:-ROOT}
      CGCPMS_BOOTSTRAP_COMPANY_NAME: ${CGCPMS_BOOTSTRAP_COMPANY_NAME:-总公司}
      CGCPMS_BOOTSTRAP_DEPARTMENT_CODE: ${CGCPMS_BOOTSTRAP_DEPARTMENT_CODE:-ROOT_DEPT}
      CGCPMS_BOOTSTRAP_DEPARTMENT_NAME: ${CGCPMS_BOOTSTRAP_DEPARTMENT_NAME:-总部}
      CGCPMS_BOOTSTRAP_ADMIN_USERNAME: ${CGCPMS_BOOTSTRAP_ADMIN_USERNAME:-admin}
      CGCPMS_BOOTSTRAP_ADMIN_REAL_NAME: ${CGCPMS_BOOTSTRAP_ADMIN_REAL_NAME:-平台管理员}
      CGCPMS_BOOTSTRAP_ADMIN_EMAIL: ${CGCPMS_BOOTSTRAP_ADMIN_EMAIL:-}
      CGCPMS_BOOTSTRAP_ADMIN_PASSWORD: ${CGCPMS_BOOTSTRAP_ADMIN_PASSWORD:-}
      # ---- CORS ----
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set in .env}
      # ---- Prometheus machine identity; blank values keep scrape access fail-closed ----
      MONITORING_SCRAPE_USERNAME: cgcpms-monitor
      MONITORING_SCRAPE_PASSWORD_FILE: /run/secrets/monitoring_scrape_password
    volumes:
      - backend-heapdumps:/var/lib/cgc-pms/heapdumps
      - backend-logs:/var/log/cgc-pms
      - ${MONITORING_SCRAPE_PASSWORD_FILE:?MONITORING_SCRAPE_PASSWORD_FILE must point to a local secret file}:/run/secrets/monitoring_scrape_password:ro
      - ${MYSQL_TRUSTSTORE_FILE:?MYSQL_TRUSTSTORE_FILE must point to the backend PKCS12 truststore}:/run/secrets/mysql-truststore.p12:ro
    # Backend port NOT exposed to host — only accessible via internal Docker network (frontend → backend proxy)
    # ports:
    #   - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - cgc-pms-net
    deploy:
      resources:
        limits:
          memory: 1G

  # ===========================================================================
  # Frontend — Nginx serving Vue 3 SPA + reverse proxy to backend (:80/:443)
  # ===========================================================================
  frontend:
    image: ${REGISTRY_URL:-}cgc-pms-frontend@${FRONTEND_DIGEST:?FRONTEND_DIGEST must be set}
    container_name: cgc-pms-frontend
    restart: unless-stopped
    depends_on:
      preflight:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      BACKEND_URL: backend:8080
    volumes:
      # SSL certificates — place server.crt and server.key here before starting
      - ./ssl:/etc/nginx/ssl:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:80/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - cgc-pms-net
    deploy:
      resources:
        limits:
          memory: 128M

# ===========================================================================
# Networks
# ===========================================================================
networks:
  cgc-pms-net:
    driver: bridge

# ===========================================================================
# Volumes
# ===========================================================================
volumes:
  mysql84-data:
  redis-data:
  minio-data:
  backend-heapdumps:
  backend-logs:
