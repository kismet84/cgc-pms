# =============================================================================
# Prometheus monitoring configuration for CGC-PMS
# =============================================================================
# Usage from deploy/:
#   docker compose --env-file .env -f docker-compose.dev.yml -f docker-compose.monitoring.yml up -d backend prometheus
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    app: cgc-pms

rule_files:
  - '/etc/prometheus/alerts.yml'

scrape_configs:
  - job_name: 'cgc-pms-backend'
    metrics_path: '/api/actuator/prometheus'
    basic_auth:
      username: 'cgcpms-monitor'
      password_file: '/run/secrets/monitoring_scrape_password'
    static_configs:
      - targets: ['backend:8080']
        labels:
          service: 'backend'
          env: 'dev'
    scrape_interval: 10s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
