# Security headers, included by every location that sets an add_header of its own.
#
# nginx does not inherit `add_header` from a parent block into a location that declares any
# add_header, and the `always` flag does not change that. Without this include, the app's HTML
# document (`location = /index.html`), the hashed assets and every API response would be served
# with no HSTS, CSP, X-Frame-Options, nosniff or Referrer-Policy.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests;" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
